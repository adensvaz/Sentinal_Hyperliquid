# ============================================================================
# FUNDING HARVEST — delta-neutral cash-and-carry on Hyperliquid.
# Short the perps paying STABLE positive funding + hold a matching spot long (simulated in paper), so price
# cancels and you collect the funding premium — the structural cost of leverage that crowded longs pay.
# Market beta ~ 0 by construction -> earns in bull, bear AND chop.
#
# THE edge that survived survivorship-honest, POINT-IN-TIME backtesting (where momentum collapsed +37% -> +9.5%,
# but this held +28% -> +20%): ~+15-20%/yr, positive every year 2024-26, ~0-3% drawdown. Delta-neutral harvesting
# doesn't depend on picking winning coins, so it isn't corrupted by survivorship. Selection is by funding
# CONSISTENCY (t-stat), not magnitude, to dodge the flip-prone whipsaw; gross is opportunity-scaled (deploy less
# when the premium is thin -> capital-preserving). Sharpe is realistically ~2-3 once basis/tail are modeled.
#
# Replaces the retired GRID book (proven fake — fill illusion; -28% every backtest, ~0% live).
# Phase 1 = PAPER (simulated spot hedge). Live is Phase 2 (real spot legs, agent wallet, testnet-first).
# ============================================================================
mode: paper
strategy: funding
capital_usdt: 10000

exchange:
  venue: hyperliquid
  hyperliquid_info_url: https://api.hyperliquid.xyz/info

universe:
  # WIDE — the funding premium lives in the hot/new coins, so scan broadly by volume (not a fixed allowlist).
  top_n: 40
  min_quote_volume_usdt: 500000

funding:
  funding_window_days: 14      # trailing window to measure each coin's funding mean + consistency
  tstat_min: 0.7               # only harvest persistently one-signed funding (mean/std > this)
  min_funding_daily: 0.0003    # QUALITY BAR (raised from 1bp/day). At 1bp/day a leg earns 3.7%/yr and needs
                               # 8 days just to repay its own 8bp round-trip cost — with 15 slots and a low bar
                               # the book fills up with names too thin to be worth owning. At 3bp/day (10.9%/yr)
                               # a leg repays itself in under 3 days. Backtest: +32% -> +44%/yr, and the average
                               # funding actually captured rises 13.8% -> 17.8%/yr. Opportunity-scaling means a
                               # thin market simply deploys less rather than reaching for junk.
  max_coins: 15                # book breadth — diversify across the richest-stable-funding names
  target_gross: 3.0            # delta-neutral -> ~0 DD, so it safely carries higher gross than a directional book
  cost_per_side: 0.0004        # maker + slippage per leg, charged on turnover
  # --- TURNOVER CONTROL (the fix): funding accrues every tick, but only re-pick/re-size the basket this often.
  # Hourly rebalancing bled ~0.08%/day of gross in fees (-26%/yr); this cuts turnover ~15x -> backtest +14%/yr 2025.
  rebalance_days: 3.0          # re-pick / re-size the basket only every 3 days (still accrues funding hourly)
  no_trade_band: 0.10          # only resize an existing leg when its target notional drifts > 10%
  min_hold_days: 3.0           # don't drop a name held < 3 days (unless its funding goes negative)
  keep_top_n: 25               # a held name stays as long as it's still within the top-25 by consistency
  exit_neg_ticks: 8            # only re-pick early after a leg pays negative 8 ticks RUNNING (~8h). Single negative
                               # hourly prints are noise — with 15 legs one is negative almost every hour, and
                               # reacting to that forced a full re-pick every tick (seen live: 2 REBALs in 13 min).

execution:
  order_type: limit
  maker: true                  # POST_ONLY both legs — funding harvest wants maker fills
  maker_fill_ratio: 0.5
  slippage_bps: 4
  min_trade_notional: 15
  min_rebalance_frac: 0.10
  margin_mode: isolated
  position_mode: net

risk:
  max_gross_leverage: 6        # delta-neutral book; headroom for the 3x notional
  max_net_exposure: 0.05       # ~0 by construction (spot long hedges perp short)
  max_drawdown_pct: 15         # catastrophe brake (backtest DD ~0-3%; this only fires on a basis blowout)
  max_position_loss_pct: 10
  funding_abs_max: 5.0         # don't filter high funding — that's exactly what we harvest
  pause_hours: 6
  monitor_seconds: 60
  dynamic_risk: false          # delta-neutral -> no vol-target/crash-guard needed
  crash_guard: false

schedule:
  rebalance_minutes: 60        # re-evaluate the book hourly (funding accrues hourly on HL)

treasury:
  enabled: false
  sweep_frac: 0.40
  sweep_interval_days: 7

state:
  db_path: data/hl_funding.db
  equity_csv: data/hl_funding_equity.csv
  log_path: data/hl_funding.log
