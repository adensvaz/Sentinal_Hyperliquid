# ============================================================================
# TREND (CTA) — dollar-neutral cross-sectional trend-following on Hyperliquid.
# Long the K coins in the strongest uptrends (price furthest above its MA), short the K in the strongest
# downtrends. The most durable systematic edge across markets and decades.
#
# Validated on 5yr Binance daily data (survivorship-caveated): Sharpe ~1.35, +75-82% CAGR, positive every
# full year 2021-2025. The raw gross drawdown (~44%) is tamed by the vol-target + drawdown-throttle risk
# overlay (via gross_scale) — same machinery as the champion book.
#
# Replaces the retired FUNDING-ALPHA book, whose pure-funding-harvest edge decayed to a 5yr Sharpe of 0.38.
# Phase 1 = PAPER (no keys). Live is Phase 2 (agent wallet, testnet-first).
# ============================================================================
mode: paper
strategy: trend
capital_usdt: 10000

exchange:
  venue: hyperliquid
  hyperliquid_info_url: https://api.hyperliquid.xyz/info

universe:
  top_n: 30                    # broad pool so the trend book has enough names for a diversified L/S
  min_quote_volume_usdt: 200000
  min_listing_days: 90        # a coin must have traded 90d before we hold it. Volume alone is no
                             # guard: CASHCAT was rank-8 by volume yet 24d old and swung 181% in a
                             # day, costing Carry $533 on one short. Age blocks the next one early.
  denylist: [ACE]              # excluded — the original ACE short-squeeze coin; too violent to trade

trend:
  top_k: 8                     # long the 8 strongest uptrends, short the 8 strongest downtrends
  ma_period: 30                # retained for reference; unused while score_mode is "breakout"
  score_mode: breakout         # SWITCHED from price-vs-MA. Measured on 900 days with survivorship
  donchian_period: 45          # removed (coins listed inside the window excluded), because the
                               # biased universe flatters every trend variant and is not evidence:
                               #
                               #                CAGR   Sharpe   turn    5bps / 10bps / 20bps
                               #   MA-30 (old)  +1.4%    0.20   0.98   +1.4% /  -6.1% / -11.9%
                               #   breakout-45 +28.3%    0.87   0.90  +28.3% /  +9.5% /  -9.2%
                               #
                               # The cost column is the argument. The live ledger says fees decide
                               # this system — Carry paid $139.71 in 38.8 days (13.2%/yr) against a
                               # gross trading P&L of -$114.51 — and the MA scorer stops working at
                               # 10bps while breakout still earns. It also turns over less (0.90 vs
                               # 0.98) and drops maxDD 36.8% -> 31.1%.
                               #
                               # 45 is not tuned. Windows 20/30/45 ALL clear zero at every universe
                               # width (20/25/30/35/40) where MA-30 does not (min -0.09); 10/14/60
                               # fail. Within that plateau the three are statistically
                               # indistinguishable, so 45 was chosen for the lowest turnover and the
                               # best cost tolerance rather than the best backtest CAGR.
                               #
                               # WHAT THIS DOES NOT FIX: regime dependence. Breakout-45 is positive
                               # in 5 of 9 quarters — exactly like the MA baseline — and still loses
                               # 57% in a bad one. Ten mechanically different ideas were tested and
                               # every single one was negative in year 1 and strongly positive in
                               # year 2. This is a cheaper, steadier expression of the same
                               # one-regime bet, not a different bet. Sizing, not scoring, is the
                               # lever for that.
  target_gross: 1.0            # HALVED from 2.0. Trend and Carry are 0.41-correlated and hold ~45% of the same
                               # names in the SAME direction, so every shared name was a doubled bet (ACE cost
                               # -$1,294 here AND -$422 in Carry). At half gross the portfolio keeps its Sharpe
                               # (1.71 vs 1.72) and drops maxDD 21.9% -> 20.2%. Same return, less duplicated risk.
                               # vol-target/DD-throttle still scale below this in bad regimes.

execution:
  order_type: limit
  maker: true                  # HL maker ~1.5bps / taker ~4.5bps
  maker_fill_ratio: 0.5        # REALISM: assume ~half of POST_ONLY orders fill as maker; the rest chase as taker
  slippage_bps: 5
  time_in_force: IOC
  min_trade_notional: 15
  min_rebalance_frac: 0.10
  margin_mode: isolated
  position_mode: net

risk:
  max_gross_leverage: 10
  max_net_exposure: 0.10       # dollar-neutral by construction; allow a small residual
  max_drawdown_pct: 45         # trend books have deep drawdowns; flatten only at catastrophe
  max_position_loss_pct: 12    # catastrophe backstop (% of equity)
  position_stop_pct: 30        # per-name stop (% of the position's OWN value) — caps short-squeeze
                               # blow-ups like the ACE short (+89% -> would cap the loss at ~30% of
                               # notional instead of ~90%). Backtested: helps the edge, kills the tail.
  funding_abs_max: 1.0
  pause_hours: 24
  monitor_seconds: 60
  # vol-target + drawdown-throttle: THIS is what tames the raw ~44% trend drawdown (feeds gross_scale)
  dynamic_risk: true
  vol_target_daily: 0.018
  vol_lookback: 21
  dd_throttle_start: 0.12
  dd_throttle_full: 0.35
  min_risk_scale: 0.25
  crash_guard: false           # market-neutral long/short — crash-guard is a directional concept

schedule:
  rebalance_minutes: 2880            # every 2 days: backtested Sharpe 0.79->0.96 vs daily
  rebalance_hour_utc: 14

treasury:                            # auto-sweep OFF — withdraw manually; dashboard shows "Free to withdraw"
  enabled: false                     # (set true to auto-bank 40% of profit into a vault each week)
  sweep_frac: 0.40
  sweep_interval_days: 7

state:
  db_path: data/hl_trend.db
  equity_csv: data/hl_trend_equity.csv
  log_path: data/hl_trend.log
