# ============================================================================
# HYPERLIQUID — carry on the venue where its edge actually lives.
# We measured Hyperliquid's cross-sectional funding dispersion at ~52x KoinBay's (and ~4.5x the
# Binance data the backtest used), so the funding-carry book — dead on KoinBay's flat funding — is
# real here. Phase 1 = read-only data + PAPER (no keys). Live execution is Phase 2 (agent wallet,
# testnet-first, double-opt-in) — see deploy/HYPERLIQUID.md.
# ============================================================================
mode: paper                    # Phase 1: paper only. Live needs the Phase-2 execution adapter + --live.
strategy: carry
capital_usdt: 10000

exchange:
  venue: hyperliquid           # <- the whole switch. Routes fx via the factory to the HL adapter.
  hyperliquid_info_url: https://api.hyperliquid.xyz/info

universe:
  top_n: 30                    # broader than KoinBay: HL's funding dispersion lives in the mid-cap alts
  min_quote_volume_usdt: 200000
  min_listing_days: 90        # a coin must have traded 90d before we hold it. Volume alone is no
                             # guard: CASHCAT was rank-8 by volume yet 24d old and swung 181% in a
                             # day, costing Carry $533 on one short. Age blocks the next one early.
  denylist: [ACE]              # excluded — too violent, keeps landing on the wrong side (squeezed Trend's
                               # short, sank Carry's long). Dropping it closes any open ACE at next rebalance.

carry:
  keep_buffer: 4               # HYSTERESIS. Enter at rank 8, but keep a name we already hold until it
                               # drops out of rank 12, so a coin sitting on the cut-off isn't sold and
                               # re-bought on ranking noise. Every dollar of loss in the trade ledger came
                               # from positions held <=2 days (339 trades, -$4,391); everything held longer
                               # made money (+$6,926). Those short holds ARE the boundary flicker. The band
                               # cut trades 648 -> 346 and churn trades 368 -> 106, moving CAGR/Sharpe/maxDD
                               # from 8.5%/0.44/22.8% to 33.1%/1.19/12.3%.
  top_k: 8                     # RAISED from 5. The book's problem was never the signal — it was breadth.
                               # At K=5 it held 10 names and the result hinged on a handful of coins: dropping
                               # a random 4 of 43 from the universe swung the backtest CAGR from -27% to +131%,
                               # a 158-point range, and one CASHCAT short (-$533) exceeded the book's entire
                               # net profit over 110 trades. At K=8 the same CAGR comes with maxDD 52.6% -> 33.0%
                               # and the spread across universe draws falls from 44pp to 13pp — 3.4x steadier.
                               # This is a robustness change, not a return forecast: it buys stability, not alpha.
  lookback: 14                 # SHORTENED from 21. The ranking asks "which coins have been running";
                               # three weeks answers who WAS running, two weeks who IS.
                               #
                               # Measured on 108 HL perps x 901 days, funding coverage 99.6%, at the
                               # LIVE gross and with the live stops, keep_buffer and risk overlays:
                               #        21d  Sharpe  0.02   CAGR  -1.2%   maxDD 24.1%
                               #        14d  Sharpe  0.88   CAGR +17.0%   maxDD 19.1%
                               # 14d and 17d (0.73) form a plateau; 7/10/21/28/35d all sit at or
                               # below zero, so this is a shape, not a spike.
                               #
                               # Three things make it credible rather than another fitted number:
                               #  1. WALK-FORWARD. Re-choosing the lookback every 90 days from past
                               #     data only picked 14d at all five refits and beat the live config
                               #     by +0.52 Sharpe. It would have been chosen in real time.
                               #  2. THE LIVE LEDGER AGREES. 203 closed trades: profit factor 0.975,
                               #     expectancy -$0.56/trade — the 21d signal traded flat in reality,
                               #     which is exactly what the panel says (Sharpe 0.02). Independent
                               #     out-of-sample confirmation of the thing being fixed.
                               #  3. Paired block-bootstrap on the daily difference: +4.78bps/day,
                               #     95% CI [+0.47, +9.24] — excludes zero. 6 of 6 robustness cuts.
                               #
                               # HONEST LIMITS: corrected for searching 7 lookbacks (Sidak) p=0.094,
                               # so it does NOT clear 5% — though Sidak assumes independent tests and
                               # these overlap heavily, which over-corrects. A narrower 60-coin panel
                               # DISAGREED (there 21d looked fine); that panel was top-60 by today's
                               # volume, and 21d only worked on the survivors. Fully delisted coins
                               # are still missing from both. Both lookbacks lose at 4x fees.
                               # Turnover rises 0.377 -> 0.415. One line, instantly reversible.
  target_gross: 1.0            # REVERTED from 1.5. The increase was never justified by anything
                               # other than a backtest, and it never reached the live book: it was
                               # committed 2026-08-20 13:47, three hours AFTER sentinel-carry last
                               # restarted (10:24), so the process kept running 1.0x while this file
                               # claimed 1.5x. Reported leverage stayed at 1.057x throughout.
                               #
                               # A config that disagrees with the running process is worse than
                               # either value: the next restart, for any reason, would have silently
                               # resized the book 50% with nobody choosing it.
                               #
                               # The evidence since: the 14-day lookback has 11.9 days live and is
                               # -1.56%, against the old 21-day signal's -0.19% over 44.1 days.
                               # Neither is distinguishable from zero — a 12-day window carries a
                               # standard error of about +/-3.6% at this book's ~20%/yr volatility.
                               # So the signal change has not yet earned a size increase; it has
                               # only earned more time.
                               #
                               # REVISIT WHEN: the 14d signal has ~100 closed trades with positive
                               # expectancy. Then 1.5x has a basis, and the growth curve below still
                               # applies (1.5x -> CAGR +24.6%, maxDD 27.4%, half-Kelly is 2.2x).
                               # Sizing below Kelly is the correction for not knowing the edge, and
                               # the Deflated Sharpe on this book is 0.564 — we do not know it yet.
                               #
                               # --- the growth-curve reasoning that argued for 1.5x, kept intact ---
                               # RAISED from 1.0, but only after the signal underneath it changed.
                               # The 1.0 below was set on the LIVE ledger of the 21-day signal, and
                               # that signal is gone — lookback is now 14, which the wide panel puts
                               # at Sharpe 0.88 against 21d's 0.02. Sizing set for a flat signal
                               # should not survive the signal being replaced.
                               #
                               # Growth-rate curve, 108-coin panel, live costs, mean log(1+L*r):
                               #     0.5x   CAGR  +8.7%   maxDD 10.0%   growth  8.4%/yr
                               #     1.0x        +17.0%         19.1%          15.7%
                               #     1.5x        +24.6%         27.4%          22.0%   <- here
                               #     2.2x  half-Kelly
                               #     4.4x  growth-optimal (full Kelly), maxDD 58.6%
                               # So 1.5x is still well under half-Kelly. It is deliberately NOT the
                               # growth-optimal number, for one reason: Kelly assumes you know your
                               # edge, and this one's Deflated Sharpe is 0.564 — barely better than
                               # a coin flip that the edge exists at all, with SR0 (the Sharpe you
                               # would expect from searching 7 lookbacks on pure noise) at 0.77
                               # against a measured 0.88. Full Kelly on a possibly-zero edge is a
                               # possibly-total loss. Sizing below Kelly IS the correction for not
                               # knowing.
                               #
                               # WHAT THIS COSTS: fees scale linearly with gross, so the ~6.6%/yr
                               # fee bill becomes ~9.9%/yr, and maxDD 19.1% -> 27.4%. Both are the
                               # price of the position size, not a defect.
                               # NOT APPLIED TO TREND, which was the original request: trend's
                               # Sharpe on the same panel is -0.20 and its growth-optimal gross is
                               # 0.05x. Leverage multiplies the sign that is already there.
                               #
                               # --- the reasoning for the 1.0 this replaces, kept because the cost
                               #     arithmetic in it is still what governs ---
                               # HALVED from 2.0 on the LIVE trade ledger, not a backtest.
                               # 203 closed trades over 38.8 days: profit factor 0.975, expectancy
                               # -$0.56/trade, gross trading P&L -$114.51 — i.e. the signal traded
                               # roughly FLAT. What actually took the book from +18% (peak $11,812)
                               # to -3.05% was cost: $139.71 of fees in 38.8 days = 13.2%/yr of
                               # capital, against a gross edge the honest walk-forward puts far
                               # below that. The book was paying 13%/yr to find out whether it had
                               # an edge.
                               # Gross is the only dial that moves cost and drawdown together while
                               # leaving Sharpe untouched (return and vol both scale linearly with
                               # it). Halving takes fees to ~6.6%/yr and turns the live -17.9%
                               # peak-to-trough into ~-9%, at no cost to the risk-adjusted return.
                               # This does NOT assume the edge is real — it stops overpaying to test
                               # it. Revisit only when live expectancy is significantly positive;
                               # 38.8 days has a t-stat of ~0.08 and proves nothing either way.

execution:
  order_type: limit
  maker: true                  # HL maker ~1.5bps / taker ~4.5bps (cheaper than KoinBay)
  maker_fill_ratio: 0.5        # REALISM: assume ~half of POST_ONLY orders fill as maker; the rest chase as taker
  slippage_bps: 5
  time_in_force: IOC
  min_trade_notional: 15       # HL min order ~$10 notional
  min_rebalance_frac: 0.10
  margin_mode: isolated
  position_mode: net

risk:
  max_gross_leverage: 10
  max_net_exposure: 0.10
  max_drawdown_pct: 45
  max_position_loss_pct: 12
  funding_abs_max: 1.0         # NOTE: HL funding is HOURLY (KoinBay was 8h) — ~8x smaller per period.
                               # Carry RANKS on it fine; live funding accrual is interval-aware in Phase 2.
  pause_hours: 24
  monitor_seconds: 60
  dynamic_risk: true
  vol_target_daily: 0.018
  vol_lookback: 21
  dd_throttle_start: 0.12
  dd_throttle_full: 0.35
  min_risk_scale: 0.25
  crash_guard: false

schedule:
  rebalance_minutes: 1440
  rebalance_hour_utc: 14

state:
  db_path: data/hl_carry.db
  equity_csv: data/hl_carry_equity.csv
  log_path: data/hl_carry.log
