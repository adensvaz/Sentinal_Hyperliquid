# ============================================================================
# CHAMPION strategy config — directional momentum + BTC-regime (the 5.5yr backtest winner).
# Runs on Hyperliquid, SEPARATELY from the neutral book: own database (data/hl_champion.db), own loop,
# own dashboard. The neutral strategy (config.yaml -> data/hl_sentinel.db) is untouched.
# ============================================================================
mode: paper
strategy: champion           # <- selects MomentumRegimeStrategy (long-only top-K momentum, regime-gated)
capital_usdt: 10000

exchange:
  venue: hyperliquid                              # migrated KoinBay -> Hyperliquid
  hyperliquid_info_url: https://api.hyperliquid.xyz/info

universe:
  top_n: 24
  min_quote_volume_usdt: 200000                   # liquidity floor (HL volume scale)

champion:
  top_k: 5                   # hold the 5 strongest names
  lookback: 30               # momentum measured over 30 days
  trend_ma: 50               # (only used when dual_confirm is on)
  regime_ma: 100             # only invest when BTC is above its 100d average (risk-on brake)
  dual_confirm: false        # rank by relative strength only. The extra 50d-uptrend filter was
                             # over-restrictive: on 5.5yr walk-forward, OFF beats ON — Sharpe
                             # 1.16->1.20, worst-half 0.83->0.92, CAGR +68%->+74% (raw, pre-overlay).
  target_gross: 1.0          # long-only, 1x gross when fully risk-on (vol-target may scale below)
  # Heavy backtest (scripts/champion_heavy.py + champion_decompose.py — FAITHFUL realized-return
  # overlay matching risk.limits.risk_scale; universe + block bootstraps) re-sorted the candidates:
  #   * momentum-weighting KEPT: beats equal-weight on Sharpe in 25/27 param configs, 73% of random
  #     coin-universes, every fee level. Sharpe 1.21->1.29, Sortino 1.40->1.51, Calmar 1.23->1.35.
  #   * breadth-scaling DROPPED: only cut drawdown by over-sitting-out; robustly HURT Sharpe (won
  #     just 12% of universes) and Calmar. A risk-reducer, not an edge — not worth the return drag.
  mom_weighted: true         # size by momentum strength (lean into the leaders), not equal slices
  max_name_weight: 0.40      # ...but never more than 40% in one coin (copy-trade-safe)
  breadth_scale: false       # OFF — failed the heavy backtest (see above)

execution:
  order_type: limit
  maker: true
  slippage_bps: 5
  time_in_force: IOC
  min_trade_notional: 15
  min_rebalance_frac: 0.10
  margin_mode: isolated
  position_mode: net

risk:
  max_gross_leverage: 10
  max_net_exposure: 1.0        # champion is net-LONG by design — no dollar-neutral rail
  max_drawdown_pct: 45         # allow the champion's natural ~30-40% drawdowns; flatten only at catastrophe
  max_position_loss_pct: 12    # loose per-name catastrophe stop (so it can ride volatility)
  pause_hours: 24
  monitor_seconds: 60
  # balanced-champion risk overlay: vol-target ~35% annual + a deep-drawdown throttle
  dynamic_risk: true
  vol_target_daily: 0.018
  vol_lookback: 21
  dd_throttle_start: 0.12
  dd_throttle_full: 0.35
  min_risk_scale: 0.25
  crash_guard: true
  crash_dd_hours: 720
  crash_bounce_hours: 48
  crash_dd_trigger: 0.15
  crash_bounce_trigger: 0.05
  crash_scale_floor: 0.5

schedule:
  rebalance_minutes: 1440
  rebalance_hour_utc: 14       # daily at 14:00 UTC (same clock as the neutral book)

state:
  db_path: data/hl_champion.db      # fresh HL track record (KoinBay history kept in data/champion.db)
  equity_csv: data/hl_champion_equity.csv
  log_path: data/hl_champion.log
